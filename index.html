<!DOCTYPE html>
<html lang="pt-BR" class="h-full bg-zinc-50/60">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IA CV — Gerador de Currículo Inteligente</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#fafafa',
                            100: '#f4f4f5',
                            200: '#e4e4e7',
                            700: '#3f3f46',
                            800: '#27272a',
                            900: '#18181b',
                            950: '#09090b',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        body {
            font-family: 'Inter', sans-serif;
        }

        #sugestoes-lista::-webkit-scrollbar,
        #lista-escolaridade-sugestoes::-webkit-scrollbar {
            width: 5px;
        }

        #sugestoes-lista::-webkit-scrollbar-thumb,
        #lista-escolaridade-sugestoes::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 9999px;
        }
    </style>
</head>

<body class="h-full flex flex-col justify-between text-zinc-900 antialiased selection:bg-zinc-900 selection:text-white">

    <div class="flex-grow">
        <!-- Header Minimalista com efeito Glassmorphism -->
        <header class="sticky top-0 z-40 bg-white/80 backdrop-blur-md border-b border-zinc-200/80">
            <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
                <div class="flex items-center gap-2.5">
                    <span class="font-semibold text-sm tracking-tight text-zinc-900">IA CV</span>
                </div>
                <span class="text-xs font-medium px-2.5 py-1 rounded-full bg-zinc-100 text-zinc-600 border border-zinc-200/60">
                    Otimizador de Currículos
                </span>
            </div>
        </header>

        <!-- Main Grid Layout -->
        <main class="max-w-7xl mx-auto px-6 py-8 grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">

            <!-- Painel de Entrada (Formulário) -->
            <aside class="lg:col-span-5 space-y-4">
                <div class="bg-white p-6 rounded-2xl border border-zinc-200/80 shadow-sm">
                    <div class="mb-6">
                        <h2 class="text-lg font-semibold tracking-tight text-zinc-900">Dados Profissionais</h2>
                        <p class="text-xs text-zinc-500 mt-0.5">Preencha as informações para estruturar o seu currículo.</p>
                    </div>

                    <form id="resume-form" onsubmit="gerarCurriculo(event)" class="space-y-4">
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
                            <div>
                                <label for="nome_completo" class="block text-xs font-medium text-zinc-700 mb-1">
                                    Nome Completo *
                                </label>
                                <input type="text" id="nome_completo" required placeholder="Guilherme Silva"
                                    class="w-full px-3 py-2 bg-zinc-50/50 border border-zinc-200 rounded-lg focus:bg-white focus:ring-2 focus:ring-zinc-900 focus:border-transparent outline-none text-xs transition placeholder:text-zinc-400">
                            </div>

                            <div>
                                <label for="cargo_pretendido" class="block text-xs font-medium text-zinc-700 mb-1">
                                    Cargo Pretendido *
                                </label>
                                <input type="text" id="cargo_pretendido" required placeholder="Desenvolvedor Frontend"
                                    class="w-full px-3 py-2 bg-zinc-50/50 border border-zinc-200 rounded-lg focus:bg-white focus:ring-2 focus:ring-zinc-900 focus:border-transparent outline-none text-xs transition placeholder:text-zinc-400">
                            </div>
                        </div>

                        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                            <div>
                                <label for="localizacao" class="block text-xs font-medium text-zinc-700 mb-1">Localização</label>
                                <input type="text" id="localizacao" placeholder="Itapeva, SP"
                                    class="w-full px-3 py-2 bg-zinc-50/50 border border-zinc-200 rounded-lg focus:bg-white focus:ring-2 focus:ring-zinc-900 focus:border-transparent outline-none text-xs transition placeholder:text-zinc-400">
                            </div>
                            <div>
                                <label for="contato_email" class="block text-xs font-medium text-zinc-700 mb-1">E-mail</label>
                                <input type="email" id="contato_email" placeholder="nome@email.com"
                                    class="w-full px-3 py-2 bg-zinc-50/50 border border-zinc-200 rounded-lg focus:bg-white focus:ring-2 focus:ring-zinc-900 focus:border-transparent outline-none text-xs transition placeholder:text-zinc-400">
                            </div>
                            <div>
                                <label for="contato_telefone" class="block text-xs font-medium text-zinc-700 mb-1">Telefone</label>
                                <input type="text" id="contato_telefone" placeholder="(15) 99999-9999" maxlength="15"
                                    class="w-full px-3 py-2 bg-zinc-50/50 border border-zinc-200 rounded-lg focus:bg-white focus:ring-2 focus:ring-zinc-900 focus:border-transparent outline-none text-xs transition placeholder:text-zinc-400">
                            </div>
                        </div>

                        <!-- Competências com Tags -->
                        <div class="relative">
                            <label for="tecnologias-input" class="block text-xs font-medium text-zinc-700 mb-1">
                                Competências e Tecnologias
                            </label>
                            <div id="tags-container"
                                class="flex flex-wrap gap-1.5 p-2 bg-zinc-50/50 border border-zinc-200 rounded-lg focus-within:bg-white focus-within:ring-2 focus-within:ring-zinc-900 transition-all min-h-[42px] cursor-text">
                                <input type="text" id="tecnologias-input" placeholder="Digite e pressione Enter..."
                                    class="flex-1 bg-transparent border-none outline-none text-xs p-1 placeholder:text-zinc-400 min-w-[120px]">
                            </div>
                            <ul id="sugestoes-lista"
                                class="hidden absolute left-0 right-0 z-50 mt-1 max-h-40 overflow-y-auto bg-white border border-zinc-200 rounded-lg shadow-lg text-xs divide-y divide-zinc-100">
                            </ul>
                        </div>

                        <!-- Escolaridade -->
                        <div class="relative">
                            <label for="escolaridade-input" class="block text-xs font-medium text-zinc-700 mb-1">
                                Escolaridade e Cursos *
                            </label>
                            <div id="tags-escolaridade-container"
                                class="flex flex-wrap gap-1.5 p-2 bg-zinc-50/50 border border-zinc-200 rounded-lg focus-within:bg-white focus-within:ring-2 focus-within:ring-zinc-900 transition-all min-h-[42px] cursor-text">
                                <input type="text" id="escolaridade-input" placeholder="Curso e Instituição..."
                                    class="flex-1 bg-transparent border-none outline-none text-xs p-1 placeholder:text-zinc-400">
                            </div>
                            <ul id="lista-escolaridade-sugestoes"
                                class="hidden absolute left-0 right-0 z-50 mt-1 max-h-40 overflow-y-auto bg-white border border-zinc-200 rounded-lg shadow-lg text-xs divide-y divide-zinc-100">
                            </ul>
                        </div>

                        <!-- Experiência -->
                        <div>
                            <label for="texto_experiencias" class="block text-xs font-medium text-zinc-700 mb-1">
                                Experiência Profissional *
                            </label>
                            <textarea id="texto_experiencias" required rows="5"
                                placeholder="Empresa | Cargo (05/2022 a Atual)&#10;- Principais responsabilidades e conquistas..."
                                class="w-full p-3 bg-zinc-50/50 border border-zinc-200 rounded-lg focus:bg-white focus:ring-2 focus:ring-zinc-900 focus:border-transparent outline-none text-xs transition-all resize-none placeholder:text-zinc-400 leading-relaxed"></textarea>
                        </div>

                        <!-- Botões de Ação -->
                        <div class="pt-2 flex items-center gap-3">
                            <button type="submit" id="btn-enviar"
                                class="flex-1 bg-zinc-900 hover:bg-zinc-800 text-white font-medium py-2.5 px-4 rounded-lg transition flex justify-center items-center gap-2 text-xs shadow-sm disabled:opacity-50 disabled:cursor-not-allowed">
                                <span>Otimizar com IA</span>
                                <div id="loading-spinner"
                                    class="hidden w-3.5 h-3.5 border-2 border-white/30 border-t-white rounded-full animate-spin">
                                </div>
                            </button>

                            <button type="button" onclick="reiniciarFormulario()"
                                class="px-4 py-2.5 bg-zinc-100 hover:bg-zinc-200 text-zinc-700 font-medium rounded-lg text-xs transition">
                                Limpar
                            </button>
                        </div>
                    </form>
                </div>

                <!-- Alerta de Erro -->
                <div id="error-message"
                    class="hidden p-4 bg-red-50/80 border border-red-200/80 text-red-700 rounded-xl text-xs flex items-start gap-2.5">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="shrink-0 mt-0.5 text-red-500">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="12" y1="8" x2="12" y2="12"></line>
                        <line x1="12" y1="16" x2="12.01" y2="16"></line>
                    </svg>
                    <span id="error-text" class="leading-relaxed"></span>
                </div>
            </aside>

            <!-- Painel de Pré-visualização (Folha A4 Simulado) -->
            <section class="lg:col-span-7 space-y-4">
                <div id="acoes-container" class="hidden flex justify-end">
                    <button type="button" onclick="baixarCurriculoPDF()"
                        class="inline-flex items-center gap-2 bg-zinc-900 hover:bg-zinc-800 text-white text-xs font-medium py-2 px-4 rounded-lg transition shadow-sm">
                        <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="7 10 12 15 17 10"></polyline>
                            <line x1="12" y1="15" x2="12" y2="3"></line>
                        </svg>
                        <span>Exportar PDF</span>
                    </button>
                </div>

                <div id="resultado-container"
                    class="bg-white p-8 md:p-12 rounded-2xl border border-zinc-200/80 shadow-sm min-h-[600px] flex flex-col justify-center transition-all relative">

                    <div id="curriculo-placeholder" class="text-center text-zinc-400 space-y-2 py-16">
                        <div class="w-10 h-10 mx-auto rounded-full bg-zinc-100 flex items-center justify-center text-zinc-400">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                                <polyline points="14 2 14 8 20 8"></polyline>
                            </svg>
                        </div>
                        <p class="font-medium text-xs text-zinc-600">Pré-visualização do documento</p>
                        <p class="text-[11px] text-zinc-400 max-w-xs mx-auto">
                            Preencha os campos ao lado e clique em "Otimizar com IA" para gerar a estrutura.
                        </p>
                    </div>

                    <div id="curriculo-conteudo" class="hidden text-xs text-zinc-800 space-y-6 leading-relaxed">
                    </div>
                </div>
            </section>

        </main>
    </div>

    <!-- Rodapé Minimalista -->
    <footer class="py-6 border-t border-zinc-200/80 bg-white">
        <div class="max-w-7xl mx-auto px-6 text-center text-xs text-zinc-400">
            <p>IA CV — Gerador Inteligente de Currículos &copy; 2026</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>

</html>
